    # ============================================================
    # 本轮正式标定数据
    # ============================================================

    lidar_topic: "/fast_calib/lidar"

    bag_path: "REPLACE_WITH_ABSOLUTE_DATA_DIR/lidar_bag"

    image_path: "REPLACE_WITH_ABSOLUTE_DATA_DIR/calib_image.jpg"

    output_path: "REPLACE_WITH_NEW_OUTPUT_DIR"
