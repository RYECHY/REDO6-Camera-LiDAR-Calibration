fast_calib:
  ros__parameters:

    # ============================================================
    # 前置圆筒 RGB 相机 1920x1080：修正历史相机注释
    # ============================================================

    fx: 796.164262460850
    fy: 796.565439605239
    cx: 998.040267016264
    cy: 586.594945318602

    k1: -0.107115015572
    k2: 0.014040533509
    p1: 0.000011518208
    p2: 0.000091001532
    k3: -0.000901838357
    # ============================================================
    # FAST-Calib 标定板参数，单位：m
